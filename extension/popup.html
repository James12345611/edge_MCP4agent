<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Enterprise Browser MCP</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header>
    <strong>Enterprise Browser MCP</strong>
    <span id="connection"></span>
  </header>
  <p id="page"></p>
  <p id="status">正在连接本机交互服务...</p>
  <label id="duration-setting">
    <span>授权时长</span>
    <span class="duration-control">
      <input id="duration-minutes" type="number" min="1" max="480" step="1" inputmode="numeric">
      <span>分钟</span>
    </span>
  </label>
  <button id="share" type="button" hidden>共享并允许 Agent 操作</button>
  <button id="revoke" type="button" hidden>立即撤销</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
